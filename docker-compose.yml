services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      MARAZUL_SECURITY_BOOTSTRAP_ADMIN_EMAIL: ${MARAZUL_SECURITY_BOOTSTRAP_ADMIN_EMAIL:-}
      MARAZUL_SECURITY_BOOTSTRAP_ADMIN_PASSWORD: ${MARAZUL_SECURITY_BOOTSTRAP_ADMIN_PASSWORD:-}
      MARAZUL_SECURITY_JWT_SECRET: ${MARAZUL_SECURITY_JWT_SECRET:-}
    depends_on:
      - telemetry-simulator
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
  telemetry-simulator:
    build: ./simulator
    ports:
      - "8090:8090"
