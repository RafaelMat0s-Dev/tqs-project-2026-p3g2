name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"
  SONARQUBE_IMAGE: sonarqube:26.11.0.134175-community

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Unit (*Test), integration (*IT, Testcontainers) and Cucumber tests, JaCoCo gates
        run: mvn -B -ntp verify
      - name: Test summary
        if: always()
        run: |
          {
            echo "### Backend"
            for f in target/surefire-reports/*.xml target/failsafe-reports/TEST-*.xml; do
              [ -f "$f" ] || continue
              grep -o 'tests="[0-9]*" errors="[0-9]*" skipped="[0-9]*" failures="[0-9]*"' "$f" | head -1 | sed "s|^|$(basename "$f" .xml): |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/cucumber-reports/
          if-no-files-found: warn

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest with coverage (80 % minimum)
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Lighthouse CI (accessibility >= 90, SLO6)
        run: npm run lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-reports
          path: |
            frontend/coverage/
            frontend/.lighthouseci/
          if-no-files-found: warn

  simulator:
    name: simulator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --no-audit --no-fund
      - name: node:test with coverage (80 % minimum)
        run: npm run test:coverage

  dependencias:
    name: dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Resolve Maven dependencies (Trivy reads ~/.m2 instead of hitting Maven Central, which rate-limits)
        working-directory: backend
        run: mvn -B -ntp -q dependency:go-offline
      - name: Trivy (Maven and npm dependencies; fails on HIGH or CRITICAL with a fix)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: docker compose up (the whole application with one command)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:5173/ > /dev/null
          curl -fsS http://localhost:5173/actuator/health/readiness | grep -q '"status":"UP"'
          curl -fsS http://localhost:5173/v3/api-docs > /dev/null
          curl -fsS http://localhost:8090/health | grep -q '"status":"UP"'
      - name: Telemetry smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5173/api/telemetry/vehicles/B-01 > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "Telemetry for B-01 did not become available within 30 s" >&2
          exit 1
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v

  quality-gate:
    name: quality-gate
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:26.11.0.134175-community
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
        ports:
          - 9000:9000
    env:
      SONAR_HOST_URL: http://localhost:9000
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: backend-reports
          path: backend/target
      - uses: actions/download-artifact@v8
        with:
          name: frontend-reports
          path: frontend
      - name: Configure SonarQube (MarAzul quality gate, analysis token)
        run: |
          SONAR_ADMIN_PASSWORD="Ci-$(openssl rand -hex 12)-Aa1!"
          SONAR_TOKEN_FILE="$RUNNER_TEMP/sonar-token"
          export SONAR_ADMIN_PASSWORD SONAR_TOKEN_FILE
          sh infra/sonarqube/setup.sh
          token="$(cat "$SONAR_TOKEN_FILE")"
          echo "::add-mask::$token"
          echo "SONAR_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Backend analysis (waits for the gate; fails the job when it fails)
        working-directory: backend
        run: mvn -B -ntp -DskipTests test-compile sonar:sonar -Dsonar.token="$SONAR_TOKEN"
      - name: Frontend analysis (waits for the gate; fails the job when it fails)
        if: success() || failure()
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run sonar -- -Dsonar.token="$SONAR_TOKEN"
      - name: Quality gate report
        if: always()
        run: bash infra/sonarqube/report.sh marazul-backend marazul-frontend >> "$GITHUB_STEP_SUMMARY" || true

  xray:
    name: xray
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: backend-reports
          path: reports
      - name: Import Cucumber results into Xray as a Test Execution
        env:
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
        run: |
          if [ -z "$XRAY_CLIENT_ID" ] || [ -z "$XRAY_CLIENT_SECRET" ]; then
            echo "::notice::XRAY_CLIENT_ID / XRAY_CLIENT_SECRET not configured; Xray import skipped."
            exit 0
          fi
          credentials=$(jq -n --arg id "$XRAY_CLIENT_ID" --arg secret "$XRAY_CLIENT_SECRET" '{client_id: $id, client_secret: $secret}')
          token=$(curl -fsS -H "Content-Type: application/json" -X POST --data "$credentials" \
            https://xray.cloud.getxray.app/api/v2/authenticate | tr -d '"')
          echo "::add-mask::$token"
          curl -fsS -H "Content-Type: application/json" -H "Authorization: Bearer $token" -X POST \
            --data @reports/cucumber-reports/cucumber.json \
            https://xray.cloud.getxray.app/api/v2/import/execution/cucumber
